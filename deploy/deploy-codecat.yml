# PROPOSED workflow — not active here. GitHub only runs workflows from the
# repository's .github/workflows/ folder. To enable it, copy this file to
# .github/workflows/deploy-codecat.yml (see codecat/README.md).
#
# It uses the same FTP account as the tlasara.dev deploy (deploy@tlasara.dev,
# whose FTP root is public_html/) and only ever writes inside ./codecat/,
# the codecat.tlasara.dev document root.
name: Deploy codecat portfolio

on:
  push:
    branches: [main]
    paths:
      - "codecat/**"
  workflow_dispatch:

# Never run two codecat deploys at once; a newer push cancels an older run.
concurrency:
  group: deploy-codecat
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codecat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codecat/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # The .htaccess carries the redirect that stops the site being served
      # at tlasara.dev/codecat/; never deploy a build without it.
      - name: Check build output
        run: test -f dist/index.html && test -f dist/.htaccess

      - name: Upload to codecat.tlasara.dev
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./codecat/dist/
          # Hard-coded on purpose, not a secret: the action uploads and
          # deletes only inside server-dir, so this pins the deploy to the
          # subdomain's folder. "./" here would overwrite tlasara.dev.
          server-dir: ./codecat/
          # Never set dangerous-clean-slate.
