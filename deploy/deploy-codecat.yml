# PROPOSED workflow — not active here. GitHub only runs workflows from the
# repository's .github/workflows/ folder. To enable it, copy this file to
# .github/workflows/deploy-codecat.yml and add the secrets listed in
# codecat/README.md.
name: Deploy codecat portfolio

on:
  push:
    branches: [main]
    paths:
      - "codecat/**"
  workflow_dispatch:

# Never run two codecat deploys at once; a newer push cancels an older run.
concurrency:
  group: deploy-codecat
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codecat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codecat/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Upload to codecat.tlasara.dev
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CODECAT_FTP_SERVER }}
          username: ${{ secrets.CODECAT_FTP_USERNAME }}
          password: ${{ secrets.CODECAT_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./codecat/dist/
          server-dir: ${{ secrets.CODECAT_FTP_SERVER_DIR }}
